name: Update Shopping Feeds (Google + Meta + GLAMI + BestPrice + Skroutz)

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours (Google fetches once/day at noon; hourly was wasteful)
  workflow_dispatch:
    inputs:
      country:
        description: 'Country code (e.g., GR, DE, all)'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  update-feeds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Google Shopping feed generator
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          COUNTRY="${{ github.event.inputs.country || 'all' }}"
          echo "🚀 Generating Google Shopping feeds for: $COUNTRY"
          node google-shopping-feed-v7.js $COUNTRY

      - name: Run Meta/Facebook feed generator
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          echo "🔵 Generating Meta Product Feed (Greece)..."
          node meta-feed-gr.js

      - name: Run GLAMI feed generator
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          echo "🟣 Generating GLAMI Product Feed (Greece)..."
          node glami-feed-gr.js

      - name: Run BestPrice.gr feed generator
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          echo "Generating BestPrice.gr Product Feed (Greece)..."
          node bestprice-feed-gr.js

      - name: Run Skroutz.gr feed generator
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          echo "🟠 Generating Skroutz.gr Product Feed (Greece)..."
          node skroutz-feed-gr.js

      - name: Run local inventory feed generator (Greece)
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          echo "🏭 Generating Local Inventory Feed (Greece)..."
          node local-inventory-feed-gr.js

      - name: Run Google Shopping feed generator (Shoes)
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_SHOES_ACCESS_TOKEN }}
        run: |
          COUNTRY="${{ github.event.inputs.country || 'all' }}"
          echo "👟 Generating Shoes Google Shopping feeds for: $COUNTRY"
          node google-shopping-feed-shoes-v1.js $COUNTRY

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add feeds/*.xml || true  # ignore warning for .gitignore'd dated snapshots
          if git diff --staged --quiet; then
            echo "📭 No changes to commit"
          else
            git commit -m "🔄 Auto-update feeds $(date +'%Y-%m-%d %H:%M UTC')"
            # Pull remote changes; on conflict, keep our freshly-generated feeds
            git pull --rebase origin main || {
              echo "⚠️ Rebase conflict — resolving by keeping our generated feeds..."
              git checkout --theirs feeds/*.xml 2>/dev/null || true
              git add feeds/*.xml || true
              git rebase --continue --no-edit || git rebase --skip
            }
            git push
            echo "✅ Feeds updated and pushed!"
          fi

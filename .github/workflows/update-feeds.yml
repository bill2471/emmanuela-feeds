name: Update Shopping Feeds (Google + Meta + GLAMI + BestPrice + Skroutz)

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours (Google fetches once/day at noon; hourly was wasteful)
  workflow_dispatch:
    inputs:
      country:
        description: 'Country code (e.g., GR, DE, all)'
        required: false
        default: 'all'

permissions:
  contents: write

# 2026-07-23: serialize runs so a manual dispatch overlapping a scheduled run
# can never race the final `git push` (the 2026-07-13 "fetch first" rejection).
# cancel-in-progress:false => queue the later run instead of dropping a refresh.
concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    # 2026-07-23: backstop against a HANG (continue-on-error only covers FAILURES).
    # A half-open socket used to be able to stall a generator indefinitely; the runner
    # default is 360min, which — combined with the concurrency group above — would also
    # queue the next scheduled run behind it. A normal full run takes ~70min, so 120min
    # is ~2x headroom while staying well inside the 6h cron interval.
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 2026-07-23: every generator is now `continue-on-error` + has an id.
      # Each feed is independent: a transient Shopify GraphQL throttle in ONE
      # generator no longer aborts the job, so it can neither SKIP a later feed
      # (e.g. Skroutz) nor DISCARD an already-built feed before the commit.
      # Writes are atomic (build full XML in memory, single writeFileSync at end),
      # so an aborted generator leaves its PREVIOUS xml intact — stale, never partial.
      # A genuine failure is still surfaced loudly by the final "Report" step.

      - name: Run Google Shopping feed generator
        id: gen_google
        continue-on-error: true
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          COUNTRY="${{ github.event.inputs.country || 'all' }}"
          echo "🚀 Generating Google Shopping feeds for: $COUNTRY"
          node google-shopping-feed-v7.js $COUNTRY

      - name: Run Meta/Facebook feed generator
        id: gen_meta
        continue-on-error: true
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          echo "🔵 Generating Meta Product Feed (Greece)..."
          node meta-feed-gr.js

      - name: Run GLAMI feed generator
        id: gen_glami
        continue-on-error: true
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          echo "🟣 Generating GLAMI Product Feed (Greece)..."
          node glami-feed-gr.js

      - name: Run BestPrice.gr feed generator
        id: gen_bestprice
        continue-on-error: true
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          echo "Generating BestPrice.gr Product Feed (Greece)..."
          node bestprice-feed-gr.js

      - name: Run Skroutz.gr feed generator (COMBINED jewelry + sandals)
        id: gen_skroutz
        continue-on-error: true
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_SHOES_ACCESS_TOKEN: ${{ secrets.SHOPIFY_SHOES_ACCESS_TOKEN }}
        run: |
          echo "🟠 Generating Skroutz.gr Product Feed (Greece) — v3.5.1..."
          node skroutz-feed-gr.js

      - name: Run local inventory feed generator (Greece)
        id: gen_localinv
        continue-on-error: true
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          echo "🏭 Generating Local Inventory Feed (Greece)..."
          node local-inventory-feed-gr.js

      - name: Run Google Shopping feed generator (Shoes)
        id: gen_google_shoes
        continue-on-error: true
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_SHOES_ACCESS_TOKEN }}
        run: |
          COUNTRY="${{ github.event.inputs.country || 'all' }}"
          echo "👟 Generating Shoes Google Shopping feeds for: $COUNTRY"
          node google-shopping-feed-shoes-v1.js $COUNTRY

      - name: Run BestPrice.gr feed generator (Shoes)
        id: gen_bestprice_shoes
        continue-on-error: true
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_SHOES_ACCESS_TOKEN }}
        run: |
          echo "👟 Generating BestPrice.gr Product Feed (Shoes)..."
          node bestprice-feed-shoes.js

      - name: Run GLAMI feed generator (Shoes)
        id: gen_glami_shoes
        continue-on-error: true
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_SHOES_ACCESS_TOKEN }}
        run: |
          echo "👟 Generating GLAMI Product Feed (Shoes)..."
          node glami-feed-shoes.js

      # if: always() => commit whatever XML was freshly built this cycle, even if
      # a generator above failed (that feed simply keeps its previous XML).
      - name: Commit and push changes
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          # ── v4.0 (2026-07-31) — ΜΗΝ κάνεις commit feed που άλλαξε ΜΟΝΟ στο <date> ──
          # ΓΙΑΤΙ (μετρημένο): δύο διαδοχικά commits του bestprice-gr.xml διέφεραν σε
          # ΑΚΡΙΒΩΣ 2 γραμμές, και οι δύο ήταν το <date> — μηδέν αλλαγή περιεχομένου.
          # Το repo έχει φτάσει τα 8,7 GB = 177x το όριο των 50 MB του jsDelivr (το
          # data.jsdelivr.com απαντά 403 "Package size exceeded"), σχεδόν εξ ολοκλήρου
          # από αυτό το timestamp churn (~120 MB/ημέρα σε 5 feeds x 4 runs).
          # Το spec της BestPrice ονομάζει το <date> «ημερομηνία δημιουργίας του αρχείου»
          # και ΔΕΝ επιβάλλει καμία απαίτηση φρεσκάδας (κανένας δείκτης ^ υποχρεωτικού).
          # ⛔ OPT-IN ΑΝΑ ΑΡΧΕΙΟ: feed μπαίνει εδώ ΜΟΝΟ αφού ο κάτοχός του διαβάσει το
          # spec του δικού του καναλιού. ΜΗΝ προσθέσεις feed που δεν σου ανήκει.
          SKIP_IF_ONLY_DATE="bestprice-gr.xml bestprice-shoes.xml"
          for name in $SKIP_IF_ONLY_DATE; do
            f="feeds/$name"
            [ -f "$f" ] || continue
            # --text: ένα NUL byte θα έκανε το git να το πει binary και να μην τυπώσει +/-
            d=$(git diff --text -U0 -- "$f" || true)
            changed=$(printf '%s\n' "$d" | grep -c '^[+-][^+-]' || true)
            dateonly=$(printf '%s\n' "$d" | grep -c '^[+-][[:space:]]*<date>' || true)
            changed=${changed:-0}; dateonly=${dateonly:-0}
            if [ "$changed" -eq 0 ]; then
              echo "   $name: καμία αλλαγή"
            elif [ "$changed" -eq "$dateonly" ]; then
              git checkout -- "$f"
              echo "⏭️  $name: ΜΟΝΟ το <date> άλλαξε — δεν γίνεται commit"
            else
              echo "✅ $name: πραγματικές αλλαγές ($changed γραμμές, οι $dateonly είναι <date>)"
            fi
          done

          git add feeds/*.xml || true  # ignore warning for .gitignore'd dated snapshots
          if git diff --staged --quiet; then
            echo "📭 No changes to commit"
          else
            git commit -m "🔄 Auto-update feeds $(date +'%Y-%m-%d %H:%M UTC')"
            # Pull remote changes; on conflict, keep our freshly-generated feeds
            git pull --rebase origin main || {
              echo "⚠️ Rebase conflict — resolving by keeping our generated feeds..."
              # v1.3 fix (2026-05-15): use feeds/ directory (not feeds/*.xml glob).
              # The glob can fail to match conflicted files during rebase, causing
              # silent fall-through where conflict markers stay in the working tree
              # and get committed. The "--" separator prevents path ambiguity.
              git checkout --theirs -- feeds/ || true
              git add -- feeds/ || true
              # v3.5.1 fix: --no-edit is NOT valid for git rebase --continue (it dropped our commit on 2026-05-14).
              # GIT_EDITOR=true makes the commit-message editor a no-op, preserving the rebased commit.
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            }
            # v1.3 safety guard (2026-05-15): NEVER push feeds with unresolved merge
            # conflict markers — they break every XML parser (BestPrice/Skroutz/GMC/Meta).
            # On 2026-05-15 commit ee3e08be silently pushed shoes feed with markers
            # because the prior glob-based --theirs checkout failed silently. Fail
            # loudly here so a human can investigate instead of serving broken XML.
            if grep -lE '^<<<<<<<|^>>>>>>>' feeds/*.xml 2>/dev/null; then
              echo "❌ FATAL: merge conflict markers detected in feed files. Aborting push."
              grep -nE '^<<<<<<<|^>>>>>>>' feeds/*.xml | head -30
              exit 1
            fi
            git push
            echo "✅ Feeds updated and pushed!"
          fi

      # 2026-07-30: BestPrice's servers CANNOT fetch raw.githubusercontent (host-level
      # HTTP 500 — see skill emmanuela-bestprice), so BOTH BestPrice feeds are served to
      # them through jsDelivr. jsDelivr caches a BRANCH ref (@main) at the edge for
      # s-maxage=43200 (12h) while this workflow runs every 6h => the CDN can serve a feed
      # up to TWO generations old, and NOTHING here ever invalidated it.
      # Measured that day: the fix for 24 duplicated «Σετ από N σετ από N» titles was
      # committed (682b1157) and pushed twice, yet BestPrice was STILL being served the
      # broken file 4h later (Age: 26940, CDN <date> 08:47 vs repo 15:16). The shoes feed
      # was 12h42m behind. Purging is the documented remedy — it was just never wired in.
      # Only BestPrice needs it: Google/Meta/GLAMI/Skroutz are read straight from
      # raw.githubusercontent. Add a filename below if a channel ever moves to jsDelivr.
      # NON-FATAL by design (same QUIET philosophy as the report step below): a CDN
      # hiccup must never turn a successful feed build red.
      - name: Purge jsDelivr cache (BestPrice feeds)
        if: always()
        continue-on-error: true
        run: |
          # 🔴 v2 (2026-07-31) — THE FIRST VERSION MADE THINGS WORSE. Measured on two real
          # runs: the purge fired 22s after the commit (03:42:29 push → 03:42:51 purge), so
          # jsDelivr re-fetched from a GitHub origin that had NOT propagated yet, cached the
          # OLD file, and gave it a FRESH 12h TTL. Both runs logged "STILL serving a stale".
          # A purge is only safe once the ORIGIN already serves the new bytes — otherwise it
          # re-primes the CDN with stale content and resets the clock. Hence phase 1.
          RAW=https://raw.githubusercontent.com/bill2471/emmanuela-feeds/main/feeds
          CDN=https://cdn.jsdelivr.net/gh/bill2471/emmanuela-feeds@main/feeds
          PURGE=https://purge.jsdelivr.net/gh/bill2471/emmanuela-feeds@main/feeds
          # --compressed is REQUIRED: it makes curl DECODE gzip so the hash is of the real
          # file (verified 2026-07-30 against the git blob sha).
          fetch_sha () { curl -sS --compressed --max-time 60 "$1" | sha256sum | cut -d' ' -f1; }

          for f in bestprice-gr.xml bestprice-shoes.xml; do
            if [ ! -f "feeds/$f" ]; then
              echo "::warning::purge skipped — feeds/$f not present in the workspace"
              continue
            fi
            want=$(sha256sum "feeds/$f" | cut -d' ' -f1)

            # ── PHASE 1: wait for GitHub's own origin to serve what we just pushed ──
            origin_ok=0
            for i in 1 2 3 4 5 6; do
              if [ "$(fetch_sha "$RAW/$f")" = "$want" ]; then
                echo "✅ $f: GitHub origin ready (check $i)"
                origin_ok=1
                break
              fi
              echo "… $f: origin still old — waiting 15s ($i/6)"
              sleep 15
            done
            if [ "$origin_ok" != "1" ]; then
              echo "::warning::GitHub origin did not serve the new $f within 90s — SKIPPING the purge on purpose. Purging now would re-cache the OLD file for 12h. Re-run later: curl -s $PURGE/$f"
              continue
            fi

            # ── PHASE 2: purge, verify, and PURGE AGAIN on mismatch (not just re-read) ──
            ok=0
            for i in 1 2 3; do
              echo "🧹 purging $f (round $i)"
              curl -sS --max-time 60 "$PURGE/$f" > /dev/null || true
              sleep $((5 * i))
              got=$(fetch_sha "$CDN/$f")
              if [ "$got" = "$want" ]; then
                echo "✅ $f: CDN matches repo ($want)"
                ok=1
                break
              fi
              echo "… round $i: CDN=$got want=$want"
            done
            if [ "$ok" != "1" ]; then
              echo "::warning::jsDelivr is STILL serving a stale $f after 3 purge rounds — BestPrice may read an outdated feed for up to 12h. Re-run: curl -s $PURGE/$f"
            fi
          done

      # 2026-07-23 (QUIET mode — Bill's choice): a transient single-cycle generator
      # throttle self-heals next run and its feed kept its previous XML, so we do NOT
      # fail the run (no "Run failed" email). The failure stays VISIBLE as a warning
      # annotation — both here (named) and on the continue-on-error step itself.
      - name: Report generator failures
        if: always()
        run: |
          fail=0
          check () { if [ "$1" = "failure" ]; then echo "::warning::Feed generator FAILED: $2 — kept previous XML, self-heals next run"; fail=1; else echo "✅ ok: $2"; fi; }
          check "${{ steps.gen_google.outcome }}"        "Google Shopping (jewelry)"
          check "${{ steps.gen_meta.outcome }}"          "Meta (jewelry)"
          check "${{ steps.gen_glami.outcome }}"         "GLAMI (jewelry)"
          check "${{ steps.gen_bestprice.outcome }}"     "BestPrice (jewelry)"
          check "${{ steps.gen_skroutz.outcome }}"       "Skroutz (combined)"
          check "${{ steps.gen_localinv.outcome }}"      "Local Inventory (jewelry)"
          check "${{ steps.gen_google_shoes.outcome }}"  "Google Shopping (shoes)"
          check "${{ steps.gen_bestprice_shoes.outcome }}" "BestPrice (shoes)"
          check "${{ steps.gen_glami_shoes.outcome }}"   "GLAMI (shoes)"
          if [ "$fail" = "1" ]; then
            echo "⚠️ One or more feed generators failed this cycle — their feeds kept the previous XML and refresh next run. (Run kept GREEN by design; see warning annotations above.)"
          else
            echo "🎉 All feed generators succeeded."
          fi
          # Intentionally exit 0 (quiet): transient throttles self-heal; the failure is a
          # warning annotation, not a red run / failure email.
